{% extends "base.html" %} {% block content %}
<div class="page">

  <div class="page-wrapper">
    <div class="page-header d-print-none">
      <div class="container-xl">
        <div class="row g-2 align-items-center">
          <div class="d-flex align-items-center gap-2">
            <i class="ti ti-briefcase fs-1"></i>
            <h1 class="page-title">شركة عمار للتجارة</h1>
          </div>
        </div>
      </div>
    </div>
    <main class="page-body">
      <div class="container-xl">
        <div class="row row-deck row-cards">
          {% for trade in trades %}
          <div class="col-sm-6 col-lg-3">
            <div class="card">
              <div class="card-body" style="height: 10rem">
                <div class="d-flex justify-content-around mb-2">
                  <div class="d-flex gap-1 aling-items-center">
                    <i class="ti ti-truck-delivery fs-1 align-bottom"></i>
                    <h2>{{trade['name']}}</h2>
                  </div>
                  <h3>{{trade['base'] + trade['profit']}}</h3>
                </div>
                <div class="d-flex justify-content-around align-items-center fs-1">
                  <div class="d-flex gap-2">
                    <i class="ti ti-cash-coin" style="color: yellowgreen; position:relative; top: 5px"></i>
                    <span>{{trade['base']}}$</span>
                  </div>
                  <div class="d-flex gap-2">
                    <i class="ti ti-cash-banknote-plus" style="color: green; position:relative; top: 5px"></i>
                    <span>{{trade['profit']}}$</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
          {% endfor %}
        </div>
    </main>
  </div>
</div>
{% endblock %}
